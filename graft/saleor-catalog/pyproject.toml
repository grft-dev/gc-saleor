[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saleor-catalog"
version = "1.0.0"
requires-python = ">=3.12"
description = "Flat Saleor catalog read hosted by Graftcode Gateway."
dependencies = [
    "psycopg[binary]>=3.2.3,<4",
]

[tool.hatch.build.targets.wheel]
only-include = ["product_catalog.py", "catalog_store.py"]

[tool.hatch.build.targets.wheel.sources]
"." = ""
